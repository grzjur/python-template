[project]
name = "app"                       # rename me: nazwa nowego projektu
version = "0.1.0"
description = "Python project template"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "pydantic-settings>=2.8",
    "logfire>=3.0",
]

[project.scripts]
app = "app.main:cli"               # rename me razem z [project] name

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]             # rename me

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
